name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Essential Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Check formatting
        run: npm run prettier:check

      - name: Run unit/API tests
        run: npm run test:unit

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm list @playwright/test --depth=0 --json | jq -r '.dependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build site
        run: npm run build
        env:
          NODE_ENV: production
          YOUTUBE_API_KEY: mock-key-for-ci
          YOUTUBE_CHANNEL_ID: mock-channel-id-for-ci

      # Runs basic.spec.js, chatbot-simple.spec.js, chatbot-quick.spec.js, audio-player.spec.js.
      # These are safe for CI: real /api/chatrag calls are either mocked via
      # page.route() or skipped with test.skip(!!process.env.CI, ...).
      # chatbot.spec.js and chatbot-api.spec.js are NOT run here because they
      # make live, unmocked calls to /api/chatrag which require a real
      # OPENROUTER_API_KEY (cost + non-determinism) - run them locally via
      # `npm run test:e2e:full` with credentials configured in .env.
      - name: Run essential tests
        run: npm run test:e2e:essential
        env:
          CI: true
          YOUTUBE_API_KEY: mock-key-for-ci
          YOUTUBE_CHANNEL_ID: mock-channel-id-for-ci

      - name: Run internal link crawl
        run: npm run test:e2e:links
        env:
          CI: true
          YOUTUBE_API_KEY: mock-key-for-ci
          YOUTUBE_CHANNEL_ID: mock-channel-id-for-ci
          SITE_DIR: _site

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
