name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Essential Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # Match @playwright/test in package-lock.json; browsers and OS libraries are preinstalled.
      image: mcr.microsoft.com/playwright:v1.60.0-noble

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run prettier:check

      - name: Run unit/API tests
        run: npm run test:unit

      - name: Build site
        run: npm run build
        env:
          NODE_ENV: production
          SITE_URL: http://localhost:3080
          YOUTUBE_API_KEY: mock-key-for-ci
          YOUTUBE_CHANNEL_ID: mock-channel-id-for-ci

      # Runs basic.spec.js, chatbot-simple.spec.js, chatbot-quick.spec.js, audio-player.spec.js.
      # These are safe for CI: real /api/chatrag calls are either mocked via
      # page.route() or skipped with test.skip(!!process.env.CI, ...).
      # chatbot.spec.js and chatbot-api.spec.js are NOT run here because they
      # make live, unmocked calls to /api/chatrag which require a real
      # OPENROUTER_API_KEY (cost + non-determinism) - run them locally via
      # `npm run test:e2e:full` with credentials configured in .env.
      - name: Run essential tests
        run: npm run test:e2e:essential
        env:
          CI: true
          YOUTUBE_API_KEY: mock-key-for-ci
          YOUTUBE_CHANNEL_ID: mock-channel-id-for-ci

      - name: Run internal link crawl
        run: npm run test:e2e:links
        env:
          CI: true
          YOUTUBE_API_KEY: mock-key-for-ci
          YOUTUBE_CHANNEL_ID: mock-channel-id-for-ci
          SITE_DIR: _site

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
